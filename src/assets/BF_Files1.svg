<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 525 181" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-miterlimit:10;"><g id="예"><rect x="1.83" y="20.801" width="521.04" height="19.51" style="fill:#ededec;"/><path d="M461.659,20.574l0,158.15" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,72.531l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,108.001l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,154.111l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,178.941l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><g><text x="9.9px" y="6.951px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">예비인증 신청관련 서류</text></g><g><text x="9.9px" y="33.355px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">예비인증 신청관련 서류 목록</text></g><g><text x="478.146px" y="33.991px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">다운로드</text></g><g><text x="9.6px" y="87.611px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">2. 자체 평가서</text><g><text x="9.6px" y="98.251px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">-</text><text x="15.254px" y="98.251px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">점수 집계<tspan x="50.942px " y="98.251px ">표</tspan>는 자체<tspan x="86.631px " y="98.251px ">평</tspan>가 점수<tspan x="122.319px " y="98.251px "> </tspan>기재 및<tspan x="152.159px " y="98.251px "> </tspan>각각의 <tspan x="182px " y="98.251px ">평</tspan>가항목 <tspan x="217.688px " y="98.251px ">산</tspan>출기준 <tspan x="253.376px " y="98.251px ">세</tspan>부항목에<tspan x="294.912px " y="98.251px "> </tspan>해당하는<tspan x="330.6px " y="98.251px "> </tspan>점수란 <tspan x="360.44px " y="98.251px ">배</tspan>경에 회<tspan x="396.128px " y="98.251px ">색</tspan>으로 표<tspan x="431.816px " y="98.251px ">시</tspan>함</text></g></g><g><text x="9.6px" y="123.071px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">3. 자체평가서에 포함된 내용이 사실임을 증명할 수 있는 자료</text><text x="9.6px" y="133.711px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">- 기본계획도면(건축, 조경, 토목 / 건축사 날인 필수) CAD파일(폰트파일 포함) 및 PDF파일</text><text x="9.6px" y="144.341px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">- 자체평가서 항목별 평가 제출서류에 해당하는 도면 CAD파일(폰트파일 포함) 및 PDF파일</text></g><text x="9.6px" y="57.987px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">1. 신청자의 신청공문 및 인증신청서</text><text x="9.6px" y="169.09px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">4. 1, 2, 3, 신청 접수를 위한 첨부서류 및 도서를 이메일(pbpb24@naver<tspan x="281.637px " y="169.09px ">.</tspan>com)로 제출</text></g></svg>