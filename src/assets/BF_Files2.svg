<?xml version="1.0" encoding="UTF-8" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg width="100%" height="100%" viewBox="0 0 525 182" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-miterlimit:10;"><g id="본"><rect x="1.83" y="21.7" width="521.04" height="19.51" style="fill:#ededec;"/><path d="M461.659,19.08l0,158.15" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,73.44l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,108.91l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,155.01l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><path d="M522.87,179.85l-521.04,0" style="fill:none;fill-rule:nonzero;stroke:#231815;stroke-width:0.25px;"/><g><text x="478.146px" y="34.9px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">다운로드</text></g><g><text x="9.6px" y="58.987px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">1. 신청자의 신청공문 및 인증신청서</text></g><g><text x="9.6px" y="88.52px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">2. 자체 평가서</text><text x="9.6px" y="99.16px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">- 점수집<tspan x="40.176px " y="99.16px ">계</tspan>표에 자<tspan x="75.864px " y="99.16px ">체</tspan>평가 점<tspan x="111.552px " y="99.16px ">수</tspan> 기재 <tspan x="141.393px " y="99.16px ">및</tspan> 각각의<tspan x="177.081px " y="99.16px "> </tspan>평가항목<tspan x="212.769px " y="99.16px "> </tspan>산출기준<tspan x="248.457px " y="99.16px "> </tspan>세부항목<tspan x="284.145px " y="99.16px ">에</tspan> 해당하<tspan x="319.833px " y="99.16px ">는</tspan> 점수란<tspan x="355.521px " y="99.16px "> </tspan>배경에 <tspan x="385.361px " y="99.16px ">회</tspan>색으로 <tspan x="421.05px " y="99.16px ">표</tspan>시함</text></g><g><text x="9.6px" y="123.98px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">3. 자체평가서에 포함된 내용이 사실임을 증명할 수 있는 자료</text><text x="9.6px" y="134.62px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">- 준공도면(건축, 조경, 토목 / 건축사 날인 필수) CAD파일(폰트파일 포함) 및 PDF파일</text><text x="9.6px" y="145.25px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">- 자체평가서 항목별 평가 제출서류에 해당하는 사진</text></g><g><text x="9.6px" y="170.09px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">4. 1, 2, 3, 신청 접수를 위한 첨부서류 및 도서를 이메일(pbpb24@naver<tspan x="281.637px " y="170.09px ">.</tspan>com)로 제출</text></g><g><text x="9.9px" y="7.85px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">본인증 신청관련 서류</text></g><g><text x="9.9px" y="34.55px" style="font-family:'NanumGothicOTF', sans-serif;font-size:8.86px;fill:#231815;">본인증 신청관련 서류 목록</text></g></g></svg>